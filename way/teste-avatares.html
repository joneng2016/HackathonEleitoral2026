<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Teste — avatares no jogo real</title>
<link rel="stylesheet" href="../css/estilo.css">
</head>
<body>

<!-- =========================================================================
     TESTE DE INTEGRAÇÃO DOS AVATARES
     -------------------------------------------------------------------------
     Cópia do index.html com um piloto no fim: carrega os mesmos quatro
     arquivos, na mesma ordem, sobre a mesma estrutura de DOM, escolhe um
     avatar e atravessa a criação até a primeira circunstância — para que o
     Chrome headless possa fotografar a tela do jogo de verdade, e não a
     ilustração isolada.

     O `?avatar=av2` na URL escolhe qual avatar o piloto pega.
     ====================================================================== -->

<header class="cabecalho">
  <div class="cabecalho__linha">
    <span class="marca">
      <span class="marca__icone" aria-hidden="true">⚖</span>
      Ilícitos em Jogo
    </span>
    <span class="contador" id="contador" aria-live="polite">Antes de começar</span>
  </div>
  <div class="trilha" id="trilha" role="progressbar"
       aria-valuemin="0" aria-valuemax="6" aria-valuenow="0"
       aria-label="Progresso na sequência de situações"></div>
  <div class="ficha" id="ficha" hidden></div>
  <div class="indice" id="indice" hidden></div>
</header>

<main class="palco" id="palco" aria-live="polite"></main>

<script src="../dados/cenas.js"></script>
<script src="../js/ilustracoes.js"></script>
<script src="../js/ficha.js"></script>
<script src="../js/app.js"></script>

<script>
(function () {
  'use strict';

  var erros = [];
  window.addEventListener('error', function (e) {
    erros.push(e.message + ' @ ' + (e.filename || '?') + ':' + (e.lineno || '?'));
  });

  function clicar(sel) {
    var e = document.querySelector(sel);
    if (!e) { return sel + ':NAO ENCONTRADO'; }
    e.click();
    return sel + ':ok';
  }

  var id = (location.search.match(/avatar=(av\d+)/) || [])[1] || 'av2';
  /* `?ate=N` para o piloto no passo N — é o que permite fotografar cada tela
     da criação, parada, na ordem em que o jogador a vê. */
  var ate = parseInt((location.search.match(/ate=(\d+)/) || [])[1], 10);
  /* `?capa=clique` sai da capa pelo toque; sem ele, sai pela tecla. Os dois
     caminhos precisam levar à mesma tela. */
  var modoCapa = (location.search.match(/capa=(\w+)/) || [])[1] || 'tecla';

  function sairDaCapa() {
    if (modoCapa === 'clique') {
      var alvo = document.querySelector('.capa__texto') || document.body;
      alvo.click();
    } else {
      document.dispatchEvent(new KeyboardEvent('keydown', {
        key: 'Enter', bubbles: true, cancelable: true
      }));
    }
    return 'capa:' + modoCapa;
  }

  /* Cada passo espera o anterior: as telas são trocadas por innerHTML, e
     clicar antes de a tela existir não faria nada. A história é a última
     escolha antes do dia da eleição: da origem o jogo vai direto à primeira
     circunstância. */
  var passos = [
    [sairDaCapa, 60],
    [function () { return clicar('[data-avatar="' + id + '"]'); }, 60],
    [function () { return clicar('[data-origem]'); }, 60]
  ];
  if (!isNaN(ate)) passos = passos.slice(0, ate);

  var log = [];
  function proximo(i) {
    if (i >= passos.length) {
      document.title = 'FIM · erros=' + erros.length + ' · ' + log.join(' | ');
      return;
    }
    var passo = passos[i];
    log.push(passo[0]());
    setTimeout(function () { proximo(i + 1); }, passo[1]);
  }

  window.addEventListener('load', function () { proximo(0); });
})();
</script>
</body>
</html>
