<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Jogo educativo sobre conduta lícita e ilícita no dia da eleição. Duas candidaturas, seis circunstâncias, quatro condutas possíveis em cada, e o julgamento da candidatura por uma juíza do TRE.">
<meta name="theme-color" content="#1f3b73">
<title>Ilícitos em Jogo — o que você faz no dia da eleição</title>

<link rel="stylesheet" href="../css/estilo.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚖️</text></svg>">

<!-- =========================================================================
     ORDEM DE CARGA — obrigatória
       1. dados/cenas.js     conteúdo jurídico editável (US-12)
       2. js/ilustracoes.js  ilustrações SVG (RNF-05), inclui a juíza
       3. js/ficha.js        a experiência e os níveis do candidato
       4. js/app.js          lógica e interface
     Não há dependência externa, etapa de build, cadastro ou instalação
     (RNF-02 / US-01). Abra o arquivo direto no navegador.
     ====================================================================== -->
<style>html:root {
  --fundo:      #eef1f8;
  --fundo-2:    #e3e8f4;
  --superficie: #ffffff;
  --superficie-2:#f7f9fd;
  --texto:      #16203a;
  --texto-suave:#5b6880;
  --borda:      #dbe1ee;
  --sombra:     0 1px 2px rgba(22,32,58,.06), 0 8px 24px rgba(22,32,58,.08);
  --sombra-alta:0 2px 4px rgba(22,32,58,.08), 0 18px 42px rgba(22,32,58,.14);

  --permitido:  #0f8f5e;
  --permitido-bg:#e6f6ee;
  --observar:   #b57206;
  --observar-bg:#fdf2dd;
  --crime:      #c62f2f;
  --crime-bg:   #fdeaea;
  --neutro:     #35507f;

  --marca:      #1f3b73;
  --marca-clara:#2f5aa8;

  /* Fundos do selo de veredito. São mais escuros que as cores de acento dos
     demais elementos porque carregam texto branco em corpo pequeno: o selo é
     uma etiqueta de ~12,5px em caixa alta e precisa de 4,5:1, não de 3:1. */
  --selo-permitido: #0a7350;
  --selo-observar:  #8a5605;
  --selo-crime:     #b02525;
  --selo-texto:     #ffffff;

  --raio:       16px;
  --raio-p:     11px;
  --toque:      52px;
  --largura:    1080px;

  /* A campanha. A cor e deliberadamente distinta da marca (azul, que governa
     o juridico) e das tres cores de veredito: a ficha do candidato nao deve
     parecer, em momento algum, um quarto veredito. */
  --rpg:        #6d4bb8;
  --rpg-forte:  #553a94;
  --rpg-bg:     #f1ecfb;
  --rpg-borda:  #ddd2f4;
  --rpg-texto:  #ffffff;
}</style></head>
<body>

<header class="cabecalho">
  <div class="cabecalho__linha">
    <span class="marca">
      <span class="marca__icone" aria-hidden="true">⚖</span>
      Ilícitos em Jogo
    </span>
    <span class="contador" id="contador" aria-live="polite">Antes de começar</span>
  </div>

  <!-- US-10 — indicador de progresso, visível durante toda a partida -->
  <div class="trilha" id="trilha" role="progressbar"
       aria-valuemin="0" aria-valuemax="6" aria-valuenow="0"
       aria-label="Progresso na sequência de situações"></div>

  <!-- A ficha do candidato: quem ele é e em que nível está. Mede a CAMPANHA,
       e não a conduta — nenhum número dela entra no julgamento. -->
  <div class="ficha" id="ficha" hidden></div>

  <!-- O índice de ilícitos: conta as condutas ilícitas da CANDIDATURA corrente
       — crimes e condutas vedadas — e é por ele, e só por ele, que a juíza
       decide se o registro é deferido ou indeferido. -->
  <div class="indice" id="indice" hidden></div>
</header>

<main class="palco" id="palco" aria-live="polite"></main>

<noscript>
  <div class="aviso-erro">
    <h1 class="cena__titulo">Este jogo precisa de JavaScript</h1>
    <p class="cena__enunciado">Ative o JavaScript no navegador para jogar. Não há
    cadastro, instalação ou envio de dados: todo o processamento ocorre no seu
    próprio dispositivo.</p>
  </div>
</noscript>

<script src="../dados/cenas.js"></script>
<script src="../js/ilustracoes.js"></script>
<script src="../js/ficha.js"></script>
<script src="../js/app.js"></script>
</body>
</html>
