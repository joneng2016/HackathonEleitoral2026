<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Jogo educativo sobre conduta lícita e ilícita no dia da eleição. Duas candidaturas, seis circunstâncias, quatro condutas possíveis em cada, e o julgamento da candidatura por uma juíza do TRE.">
<meta name="theme-color" content="#1f3b73">
<title>Ilícitos em Jogo — o que você faz no dia da eleição</title>

<link rel="stylesheet" href="css/estilo.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚖️</text></svg>">

<!-- =========================================================================
     ORDEM DE CARGA — obrigatória
       1. dados/cenas.js     conteúdo jurídico editável (US-12) + camada de RPG
       2. js/ilustracoes.js  ilustrações SVG (RNF-05), inclui a juíza
       3. js/ficha.js        ficha, atributos, níveis e o d20
       4. js/app.js          lógica e interface
     Não há dependência externa, etapa de build, cadastro ou instalação
     (RNF-02 / US-01). Abra o arquivo direto no navegador.
     ====================================================================== -->
</head>
<body>

<header class="cabecalho">
  <div class="cabecalho__linha">
    <span class="marca">
      <span class="marca__icone" aria-hidden="true">⚖</span>
      Ilícitos em Jogo
    </span>
    <span class="contador" id="contador" aria-live="polite">Antes de começar</span>
  </div>

  <!-- US-10 — indicador de progresso, visível durante toda a partida -->
  <div class="trilha" id="trilha" role="progressbar"
       aria-valuemin="0" aria-valuemax="6" aria-valuenow="0"
       aria-label="Progresso na sequência de situações"></div>

  <!-- A ficha do personagem: nível, atributos, legitimidade e caixa. Mede a
       CAMPANHA, e não a conduta — nenhum número dela entra no julgamento. -->
  <div class="ficha" id="ficha" hidden></div>

  <!-- O índice de ilícitos: conta as condutas ilícitas da CANDIDATURA corrente
       — crimes e condutas vedadas — e é por ele, e só por ele, que a juíza
       decide se o registro é deferido ou indeferido. A decisão é a maioria
       dos atos: mais atos lícitos, deferido; mais atos ilícitos, indeferido.
       A ficha do personagem não entra nessa conta. -->
  <div class="indice" id="indice" hidden></div>
</header>

<main class="palco" id="palco" aria-live="polite"></main>

<noscript>
  <div class="aviso-erro">
    <h1 class="cena__titulo">Este jogo precisa de JavaScript</h1>
    <p class="cena__enunciado">Ative o JavaScript no navegador para jogar. Não há
    cadastro, instalação ou envio de dados: todo o processamento ocorre no seu
    próprio dispositivo.</p>
  </div>
</noscript>

<script src="dados/cenas.js"></script>
<script src="js/ilustracoes.js"></script>
<script src="js/ficha.js"></script>
<script src="js/app.js"></script>
</body>
</html>
